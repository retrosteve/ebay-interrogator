[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ebay-interrogator"
version = "0.1.0"
description = "Rank eBay UK listings by conservative estimated resale profit"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
ebay-interrogator = "ebay_interrogator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.pyright]
extraPaths = ["src"]